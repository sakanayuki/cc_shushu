<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101822" />
    <title>Flick Card</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05080c;
        overscroll-behavior: none;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100dvh;
        /* Pointer Events でフリックを取るために必須 */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #boot-error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        color: #c3d0de;
        background: #101822;
        font:
          16px/1.7 system-ui,
          -apple-system,
          sans-serif;
        z-index: 20;
      }

      #boot-error strong {
        font-size: 20px;
        color: #e0574a;
      }

      body.booted #boot-error {
        display: none;
      }

      .debug-panel {
        position: fixed;
        /* HUD（上端）とも射出領域（下端）とも重ならない高さに置く */
        top: 18%;
        left: 0;
        width: min(280px, 72vw);
        max-height: 78dvh;
        overflow-y: auto;
        background: rgba(10, 16, 24, 0.94);
        border: 1px solid #2a3442;
        border-radius: 8px;
        color: #cfd8e3;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        z-index: 10;
        touch-action: pan-y;
      }

      .debug-panel.collapsed {
        width: auto;
        opacity: 0.75;
      }

      .debug-panel.collapsed .debug-body {
        display: none;
      }

      .debug-header {
        padding: 8px 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: #16202c;
        cursor: pointer;
        user-select: none;
      }

      .debug-body {
        padding: 6px 10px 10px;
      }

      .debug-section {
        margin: 10px 0 4px;
        color: #6f8095;
        letter-spacing: 0.1em;
        font-size: 11px;
      }

      .debug-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 6px;
        margin-bottom: 6px;
      }

      .debug-name {
        color: #9fb0c4;
      }

      .debug-value {
        color: #f0f4f8;
        text-align: right;
      }

      .debug-row input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
      }

      .debug-est {
        margin: 0;
        padding: 6px 8px;
        background: #0c1219;
        border-radius: 4px;
        white-space: pre-wrap;
        color: #b7c6d6;
      }

      .debug-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 10px;
      }

      .debug-buttons button {
        padding: 8px 4px;
        background: #22303f;
        color: #dbe5f0;
        border: 1px solid #38475a;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }

      .debug-buttons button:active {
        background: #2f4155;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <!--
      起動に失敗したとき、真っ黒な画面のまま原因が分からなくなるのを防ぐ。
      既定で表示しておき、main.ts が起動しきった時点で body.booted により隠す。
      スクリプトの読み込み失敗や初期化時の例外では、このまま残る。
    -->
    <div id="boot-error" role="alert">
      <strong>読み込みに失敗しました</strong>
      <span>ページを再読み込みしても直らない場合は、配信されているファイルが
        ビルド結果ではない可能性があります。</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
